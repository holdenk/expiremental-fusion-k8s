apiVersion: apps/v1
kind: Deployment
metadata:
  name: fusion
  labels:
    app.kubernetes.io/name: fusion
spec:
  # SQLite on a ReadWriteOnce volume, with sessions and OIDC state held in
  # memory: one replica, and the old pod must stop before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: fusion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fusion
    spec:
      # Required. A Service named `fusion` would otherwise inject
      # FUSION_PORT=tcp://<ip>:80, which Fusion parses as "listen on port 80".
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fusion
          image: ghcr.io/0x2e/fusion:1.3.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: FUSION_PORT
              value: "8080"
            - name: FUSION_DB_PATH
              value: /data/fusion.db
          envFrom:
            - secretRef:
                name: fusion-secrets
            - configMapRef:
                name: fusion-config
                optional: true
          # Fusion has no dedicated health endpoint; this is the path its own
          # Dockerfile HEALTHCHECK uses.
          startupProbe:
            httpGet:
              path: /api/oidc/enabled
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/oidc/enabled
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/oidc/enabled
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fusion-data
        - name: tmp
          emptyDir: {}
